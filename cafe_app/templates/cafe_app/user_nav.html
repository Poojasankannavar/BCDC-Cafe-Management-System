
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BCDC Café | User Navigation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Navbar */
        .cafe-navbar {
            background: #25150e;
            padding: 14px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        /* Brand */
        .cafe-brand {
            color: #f5c16c !important;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        .cafe-brand i {
            margin-right: 8px;
        }

        /* Navigation links */
        .cafe-navbar .nav-link {
            color: #f5e8dc;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 12px !important;
            transition: 0.3s ease;
        }

        .cafe-navbar .nav-link:hover,
        .cafe-navbar .nav-link:focus {
            color: #f5c16c;
        }

        .cafe-navbar .nav-link i {
            margin-right: 5px;
        }

        /* Mobile menu button */
        .cafe-navbar .navbar-toggler {
            border: 1px solid #f5c16c;
        }

        .cafe-navbar .navbar-toggler:focus {
            box-shadow: 0 0 0 0.15rem rgba(245, 193, 108, 0.3);
        }

        .cafe-navbar .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        /* Profile button */
        .profile-link {
            border: 1px solid #f5c16c;
            border-radius: 8px;
            margin-left: 8px;
        }

        .profile-link:hover {
            background: rgba(245, 193, 108, 0.1);
        }

        /* Logout button */
        .logout-link {
            background: #f5c16c;
            color: #321c10 !important;
            border-radius: 8px;
            margin-left: 8px;
        }

        .logout-link:hover {
            background: #ffdaa0;
            color: #321c10 !important;
        }

        /* Responsive design */
        @media (max-width: 991px) {
            .cafe-navbar .navbar-nav {
                padding-top: 12px;
            }

            .cafe-navbar .nav-link {
                padding: 10px 5px !important;
            }

            .profile-link,
            .logout-link {
                display: inline-block;
                margin: 5px 0;
                text-align: center;
                width: fit-content;
                padding: 10px 14px !important;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg cafe-navbar">
    <div class="container">

        <!-- Café Brand -->
        <a class="navbar-brand cafe-brand"
           href="{% url 'user_home' %}">
            <i class="bi bi-cup-hot-fill"></i>
            BCDC Café
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#cafeNavbar"
                aria-controls="cafeNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation Menu -->
        <div class="collapse navbar-collapse" id="cafeNavbar">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                <!-- Home -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_home' %}">
                        <i class="bi bi-house-door-fill"></i>
                        Home
                    </a>
                </li>

                <!-- Menu -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_menu' %}">
                        <i class="bi bi-cup-straw"></i>
                        Menu
                    </a>
                </li>

                <!-- My Orders -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'my_order' %}">
                        <i class="bi bi-bag-check-fill"></i>
                        My Orders
                    </a>
                </li>

                <!-- About -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_about' %}">
                        <i class="bi bi-info-circle-fill"></i>
                        About
                    </a>
                </li>

                <!-- Contact -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_contact' %}">
                        <i class="bi bi-envelope-fill"></i>
                        Contact
                    </a>
                </li>

            </ul>

            <!-- Profile and Logout -->
            <div class="navbar-nav">

                <a class="nav-link profile-link"
                   href="{% url 'my_profile' %}">
                    <i class="bi bi-person-circle"></i>
                    My Profile
                </a>

                <a class="nav-link logout-link"
                   href="{% url 'userlogout' %}">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>

            </div>

        </div>
    </div>
</nav>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
