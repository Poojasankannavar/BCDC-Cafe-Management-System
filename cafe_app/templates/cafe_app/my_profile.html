<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | BCDC Café</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { margin: 0; background: #f8f5f0; color: #39251c; font-family: 'Segoe UI', sans-serif; }
        main { max-width: 680px; margin: 48px auto; padding: 0 16px; }
        .profile-card { background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 5px 24px #41271712; }
        h1 { font-weight: 800; }
        .btn-brew { background: #68432b; color: #fff; }
        .btn-brew:hover { background: #422719; color: #fff; }
    </style>
</head>
<body>
    {% include 'cafe_app/user_nav.html' %}
    <main>
        <section class="profile-card">
            <h1><i class="bi bi-person-circle me-2"></i>My Profile</h1>
            <p class="text-secondary">Update your account name and mobile number.</p>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post" action="{% url 'my_profile' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="user_name" class="form-label">Full name</label>
                    <input id="user_name" name="user_name" class="form-control" maxlength="100" value="{{ profile.user_name }}" autocomplete="name" required>
                </div>
                <div class="mb-4">
                    <label for="mobile_number" class="form-label">Mobile number</label>
                    <input id="mobile_number" name="mobile_number" class="form-control" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" value="{{ profile.mobile_number }}" autocomplete="tel" required>
                </div>
                <button class="btn btn-brew" type="submit">Save changes</button>
                <a class="btn btn-outline-secondary ms-2" href="{% url 'user_home' %}">Back to home</a>
            </form>
        </section>
    </main>
</body>
</html>
